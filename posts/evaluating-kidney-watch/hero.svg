<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="An AI workflow audit pipeline. Eleven published issues feed a magnifying-glass audit step, which surfaces a small set of fixes marked with a checkmark, flowing into a published dashboard and a scheduled recheck.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f8f9"/>
      <stop offset="1" stop-color="#e6f1f3"/>
    </linearGradient>
    <marker id="h-arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <path d="M0 0 L10 3.5 L0 7 z" fill="#1a7a8a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="120" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="700" fill="#1a4e57">Does the AI workflow still work?</text>
  <text x="600" y="168" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="24" fill="#4a6c72">Auditing 11 issues of Kidney Watch</text>

  <!-- issues stack -->
  <rect x="120" y="352" width="92" height="70" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="3"/>
  <rect x="108" y="364" width="92" height="70" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="3"/>
  <rect x="96" y="376" width="92" height="70" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="4"/>
  <line x1="112" y1="396" x2="168" y2="396" stroke="#1a7a8a" stroke-width="3.5"/>
  <line x1="112" y1="411" x2="168" y2="411" stroke="#1a7a8a" stroke-width="3.5"/>
  <line x1="112" y1="426" x2="150" y2="426" stroke="#1a7a8a" stroke-width="3.5"/>
  <text x="142" y="478" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#1a4e57">11 issues</text>

  <!-- audit / magnifying glass over checklist -->
  <rect x="320" y="342" width="118" height="86" rx="10" fill="#ffffff" stroke="#1a7a8a" stroke-width="4"/>
  <line x1="340" y1="366" x2="404" y2="366" stroke="#1a7a8a" stroke-width="3.5"/>
  <line x1="340" y1="382" x2="404" y2="382" stroke="#1a7a8a" stroke-width="3.5"/>
  <line x1="340" y1="398" x2="386" y2="398" stroke="#1a7a8a" stroke-width="3.5"/>
  <circle cx="418" cy="404" r="26" fill="#ffffff" stroke="#1a7a8a" stroke-width="5"/>
  <line x1="436" y1="422" x2="456" y2="442" stroke="#1a7a8a" stroke-width="6" stroke-linecap="round"/>
  <text x="399" y="478" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#1a4e57">Audit</text>

  <!-- fixes found (coral gate, matches the review-gate colour used elsewhere on the site) -->
  <rect x="560" y="342" width="118" height="86" rx="10" fill="#fdeee9" stroke="#e07a5f" stroke-width="4"/>
  <circle cx="619" cy="385" r="14" fill="#c2512e" stroke="#fdeee9" stroke-width="3"/>
  <path d="M612 385 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="619" y="412" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" font-weight="700" fill="#c2512e">4 fixes</text>
  <text x="619" y="478" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#c2512e">Found &amp; applied</text>

  <!-- published dashboard -->
  <rect x="800" y="342" width="118" height="86" rx="10" fill="#ffffff" stroke="#1a7a8a" stroke-width="4"/>
  <rect x="818" y="360" width="34" height="50" rx="3" fill="none" stroke="#1a7a8a" stroke-width="3"/>
  <rect x="824" y="392" width="8" height="14" fill="#1a7a8a"/>
  <rect x="836" y="382" width="8" height="24" fill="#1a7a8a"/>
  <rect x="864" y="366" width="36" height="10" rx="2" fill="none" stroke="#1a7a8a" stroke-width="2.5"/>
  <rect x="864" y="382" width="36" height="10" rx="2" fill="none" stroke="#1a7a8a" stroke-width="2.5"/>
  <rect x="864" y="398" width="24" height="10" rx="2" fill="none" stroke="#1a7a8a" stroke-width="2.5"/>
  <text x="859" y="478" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#1a4e57">Dashboard</text>

  <!-- scheduled recheck (clock with repeat arrow) -->
  <circle cx="1040" cy="385" r="43" fill="#ffffff" stroke="#1a7a8a" stroke-width="4"/>
  <line x1="1040" y1="385" x2="1040" y2="358" stroke="#1a7a8a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="1040" y1="385" x2="1059" y2="397" stroke="#1a7a8a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M1012 358 A 43 43 0 0 1 1078 372" fill="none" stroke="#1a7a8a" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M1073 364 L1080 373 L1069 376 Z" fill="#1a7a8a"/>
  <text x="1040" y="478" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#1a4e57">Every 10 weeks</text>

  <!-- connectors -->
  <line x1="220" y1="385" x2="312" y2="385" stroke="#1a7a8a" stroke-width="4" marker-end="url(#h-arrow)"/>
  <line x1="446" y1="385" x2="552" y2="385" stroke="#1a7a8a" stroke-width="4" marker-end="url(#h-arrow)"/>
  <line x1="686" y1="385" x2="792" y2="385" stroke="#1a7a8a" stroke-width="4" marker-end="url(#h-arrow)"/>
  <line x1="926" y1="385" x2="989" y2="385" stroke="#1a7a8a" stroke-width="4" marker-end="url(#h-arrow)"/>
</svg>
