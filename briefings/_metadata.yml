# Applies to all briefings in this folder
freeze: false
title-block-banner: true

# "Previous issues" list auto-appended to every briefing for internal linking / discovery
listing:
  id: previous-issues
  contents: "../*/index.qmd"
  type: default
  max-items: 5
  sort: "date desc"
  fields: [date, title, description]

# Reader comments via giscus (GitHub Discussions in Laszlo75/portfolio-comments)
comments:
  giscus:
    repo: Laszlo75/portfolio-comments
    repo-id: "R_kgDOTBgU3A"
    category: "Announcements"
    category-id: "DIC_kwDOTBgU3M4C_pFp"
    mapping: pathname
    reactions-enabled: true
    input-position: bottom
    theme: noborder_light
    language: en
    loading: lazy
